<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local SMS Simulator</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18312f;
      --muted: #637572;
      --paper: #f6f8f3;
      --panel: #ffffff;
      --line: #dce5df;
      --accent: #176b5b;
      --accent-soft: #dcefe8;
      --danger: #9c3d38;
    }

    * { box-sizing: border-box; }
    body {
      background: radial-gradient(circle at 10% 0%, #e4f1e8 0, transparent 34rem), var(--paper);
      color: var(--ink);
      font-family: Georgia, 'Times New Roman', serif;
      margin: 0;
      min-height: 100vh;
    }
    main { margin: 0 auto; max-width: 42rem; padding: 2.5rem 1.25rem 3rem; }
    h1 { font-size: clamp(2rem, 8vw, 3.6rem); line-height: .98; margin: 0; }
    .lede { color: var(--muted); font-family: 'Trebuchet MS', sans-serif; line-height: 1.5; margin: .75rem 0 1.5rem; }
    .panel { background: var(--panel); border: 1px solid var(--line); box-shadow: 0 1.5rem 3rem rgba(24, 49, 47, .08); padding: 1rem; }
    label { color: var(--muted); display: grid; font-family: 'Trebuchet MS', sans-serif; font-size: .75rem; font-weight: bold; gap: .35rem; margin-bottom: .9rem; text-transform: uppercase; }
    input, button { border: 1px solid var(--line); border-radius: .35rem; font: inherit; min-height: 2.7rem; padding: .55rem .75rem; }
    input { background: var(--panel); color: var(--ink); width: 100%; }
    button { background: var(--accent); border-color: var(--accent); color: white; cursor: pointer; font-family: 'Trebuchet MS', sans-serif; font-weight: bold; }
    button:hover { background: #0f5145; }
    button.secondary { background: transparent; border-color: var(--line); color: var(--ink); }
    #messages { background: #fbfdfb; border: 1px solid var(--line); min-height: 18rem; margin-bottom: 1rem; overflow-y: auto; padding: 1rem; }
    .message { border-left: 3px solid var(--line); margin: 0 0 .9rem; padding: .2rem .75rem; white-space: pre-wrap; }
    .user { border-color: #24527a; }
    .bot { border-color: var(--accent); }
    .error { border-color: var(--danger); color: var(--danger); }
    .message-label { display: block; color: var(--muted); font-family: 'Trebuchet MS', sans-serif; font-size: .72rem; font-weight: bold; margin-bottom: .2rem; text-transform: uppercase; }
    form { display: flex; gap: .5rem; }
    form input { flex: 1; }
    .actions { display: flex; gap: .5rem; margin-top: .75rem; }
    .status { color: var(--muted); font-family: 'Trebuchet MS', sans-serif; font-size: .85rem; min-height: 1.3rem; margin-top: .75rem; }
    @media (max-width: 520px) {
      main { padding: 1.5rem .75rem 2rem; }
      form { align-items: stretch; flex-direction: column; }
      .actions { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Local SMS Simulator</h1>
    <p class="lede">Send messages through the existing SMS webhook using one phone number per conversation.</p>
    <section class="panel">
      <label for="phone">From phone number
        <input id="phone" value="+919392123042" autocomplete="tel" inputmode="tel">
      </label>
      <div id="messages" aria-live="polite"></div>
      <form id="sms-form">
        <input id="body" autocomplete="off" placeholder="Type HI or your next reply" required>
        <button type="submit">Send SMS</button>
      </form>
      <div class="actions">
        <button type="button" class="secondary" id="clear">Clear display</button>
      </div>
      <div class="status" id="status" role="status"></div>
    </section>
  </main>
  <script>
    const phoneInput = document.getElementById('phone');
    const bodyInput = document.getElementById('body');
    const messages = document.getElementById('messages');
    const status = document.getElementById('status');
    const savedPhone = localStorage.getItem('smsSimulatorPhone');

    if (savedPhone) phoneInput.value = savedPhone;

    function addMessage(kind, label, text) {
      const item = document.createElement('div');
      item.className = `message ${kind}`;
      const heading = document.createElement('span');
      heading.className = 'message-label';
      heading.textContent = label;
      item.append(heading, document.createTextNode(text));
      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
    }

    document.getElementById('sms-form').addEventListener('submit', async event => {
      event.preventDefault();
      const from = phoneInput.value.trim();
      const body = bodyInput.value.trim();
      if (!from || !body) return;

      localStorage.setItem('smsSimulatorPhone', from);
      addMessage('user', `From ${from}`, body);
      bodyInput.value = '';
      status.textContent = 'Sending...';

      try {
        const response = await fetch('/api/channels/sms/webhook', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ from, body })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'Webhook request failed');
        if (result.reply) addMessage('bot', `Backend reply (${result.state})`, result.reply);
        status.textContent = result.duplicate ? 'Duplicate message ignored.' : 'Message processed.';
      } catch (error) {
        addMessage('error', 'Error', error.message);
        status.textContent = 'Request failed.';
      }

      bodyInput.focus();
    });

    document.getElementById('clear').addEventListener('click', () => {
      messages.replaceChildren();
      status.textContent = '';
      bodyInput.focus();
    });
  </script>
</body>
</html>
