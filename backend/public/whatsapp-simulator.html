<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CareOS Local WhatsApp Simulator</title>
  <style>
    :root {
      --wa-green: #128c7e;
      --wa-dark-green: #075e54;
      --wa-light-green: #dcf8c6;
      --wa-bg: #ece5dd;
      --wa-panel: #ffffff;
      --wa-gray: #718096;
      --wa-blue: #3182ce;
      --wa-danger: #e53e3e;
    }
    body {
      background-color: var(--wa-bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 1.5rem 1rem;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 44rem;
      background: var(--wa-panel);
      border-radius: 0.75rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 90vh;
    }
    header {
      background: var(--wa-dark-green);
      color: white;
      padding: 0.9rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      font-size: 1.2rem;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .phone-bar {
      background: #f7fafc;
      border-bottom: 1px solid #e2e8f0;
      padding: 0.6rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.9rem;
    }
    .phone-bar label {
      font-weight: 600;
      color: #4a5568;
    }
    .phone-bar input {
      padding: 0.4rem 0.6rem;
      border: 1px solid #cbd5e0;
      border-radius: 0.375rem;
      font-size: 0.95rem;
      flex: 1;
      max-width: 14rem;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      background-image: radial-gradient(#d4cdc5 1px, transparent 1px);
      background-size: 16px 16px;
      background-color: var(--wa-bg);
    }
    .message {
      max-width: 80%;
      padding: 0.65rem 0.9rem;
      border-radius: 0.5rem;
      font-size: 0.95rem;
      line-height: 1.4;
      white-space: pre-wrap;
      position: relative;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
    }
    .user {
      align-self: flex-end;
      background: var(--wa-light-green);
      color: #1a202c;
      border-bottom-right-radius: 0.1rem;
    }
    .bot {
      align-self: flex-start;
      background: #ffffff;
      color: #1a202c;
      border-bottom-left-radius: 0.1rem;
    }
    .msg-meta {
      font-size: 0.7rem;
      color: var(--wa-gray);
      margin-bottom: 0.2rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .voice-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      background: #ebf8ff;
      color: var(--wa-blue);
      padding: 0.15rem 0.4rem;
      border-radius: 0.25rem;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
    }
    .doc-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      background: #e6fffa;
      color: var(--wa-green);
      padding: 0.2rem 0.5rem;
      border-radius: 0.25rem;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
      border: 1px solid #b2f5ea;
    }
    form {
      display: flex;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      background: #f0f2f5;
      align-items: center;
      border-top: 1px solid #e2e8f0;
    }
    form input[type="text"] {
      flex: 1;
      padding: 0.65rem 0.9rem;
      border: 1px solid #cbd5e0;
      border-radius: 1.5rem;
      font-size: 0.95rem;
      outline: none;
    }
    form input[type="text"]:focus {
      border-color: var(--wa-green);
    }
    .icon-btn {
      background: transparent;
      border: none;
      font-size: 1.25rem;
      cursor: pointer;
      padding: 0.4rem 0.6rem;
      border-radius: 50%;
      color: #4a5568;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease;
    }
    .icon-btn:hover {
      background: #e2e8f0;
    }
    .icon-btn.recording {
      color: var(--wa-danger);
      background: #fed7d7;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    .send-btn {
      background: var(--wa-green);
      color: white;
      border: none;
      padding: 0.6rem 1.1rem;
      border-radius: 1.5rem;
      font-weight: 600;
      cursor: pointer;
    }
    .send-btn:hover {
      background: var(--wa-dark-green);
    }
    .extra-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.4rem 1rem 0.6rem;
      background: #f0f2f5;
      font-size: 0.8rem;
      color: #718096;
    }
    .voice-presets select {
      font-size: 0.8rem;
      padding: 0.2rem 0.4rem;
      border-radius: 0.25rem;
      border: 1px solid #cbd5e0;
    }
    #file-input {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>💬 WhatsApp Simulator</h1>
      <button type="button" id="reset-btn" style="background:#e53e3e; color:white; border:none; padding:0.35rem 0.75rem; border-radius:0.3rem; cursor:pointer; font-size:0.8rem; font-weight:600;">Reset Session</button>
    </header>

    <div class="phone-bar">
      <label for="phone">Sender Phone:</label>
      <input id="phone" value="+919876543210" autocomplete="tel">
      <span style="font-size:0.8rem; color:#718096;">(Existing or new patient)</span>
    </div>

    <div id="messages" aria-live="polite"></div>

    <form id="chat-form">
      <input type="file" id="file-input" accept="image/*,application/pdf">
      <button type="button" class="icon-btn" id="attach-btn" title="Attach Document or Prescription">📎</button>
      <button type="button" class="icon-btn" id="mic-btn" title="Voice Input (Speech-to-Text)">🎤</button>
      <input id="message" type="text" autocomplete="off" placeholder="Type a message or use voice..." required>
      <button type="submit" class="send-btn">Send</button>
    </form>

    <div class="extra-bar">
      <div class="voice-presets">
        <span>Quick Voice Test:</span>
        <select id="voice-presets-select">
          <option value="">-- Choose voice preset --</option>
          <option value="Hi">"Hi"</option>
          <option value="3">"3 (English)"</option>
          <option value="Leg joint pain since 3 days">"Leg joint pain since 3 days"</option>
          <option value="2">"2 (1 to 3 days / Moderate)"</option>
          <option value="5">"5 (None of these)"</option>
          <option value="1">"1 (Confirm)"</option>
          <option value="Severe chest pain">"Severe chest pain"</option>
        </select>
        <button type="button" id="send-preset-btn" style="font-size:0.75rem; padding:0.2rem 0.5rem; cursor:pointer;">Speak</button>
      </div>
      <div id="stt-status">Voice: Ready</div>
    </div>
  </div>

  <script>
    const phoneInput = document.getElementById('phone');
    const messageInput = document.getElementById('message');
    const messagesContainer = document.getElementById('messages');
    const fileInput = document.getElementById('file-input');
    const attachBtn = document.getElementById('attach-btn');
    const micBtn = document.getElementById('mic-btn');
    const sttStatus = document.getElementById('stt-status');
    const resetBtn = document.getElementById('reset-btn');
    const voicePresetsSelect = document.getElementById('voice-presets-select');
    const sendPresetBtn = document.getElementById('send-preset-btn');

    const storedPhone = localStorage.getItem('simulatorPhone');
    if (storedPhone) phoneInput.value = storedPhone;

    function addMessage(kind, text, options = {}) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${kind}`;

      const meta = document.createElement('div');
      meta.className = 'msg-meta';
      meta.textContent = kind === 'user' ? 'You' : 'CareOS Bot';
      msgDiv.appendChild(meta);

      if (options.isVoice) {
        const voiceBadge = document.createElement('div');
        voiceBadge.className = 'voice-tag';
        voiceBadge.innerHTML = '🎤 <em>Voice Message (Transcribed)</em>';
        msgDiv.appendChild(voiceBadge);
      }

      if (options.fileName) {
        const docBadge = document.createElement('div');
        docBadge.className = 'doc-tag';
        docBadge.innerHTML = `📎 Document Attached: <strong>${options.fileName}</strong>`;
        msgDiv.appendChild(docBadge);
      }

      const bodyDiv = document.createElement('div');
      bodyDiv.textContent = text;
      msgDiv.appendChild(bodyDiv);

      messagesContainer.appendChild(msgDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    async function sendTextMessage(messageText, isVoice = false) {
      const phone = phoneInput.value.trim();
      const message = messageText.trim();
      if (!phone || !message) return;
      localStorage.setItem('simulatorPhone', phone);

      addMessage('user', message, { isVoice });

      try {
        const response = await fetch('/api/test/whatsapp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            phone,
            message,
            messageId: `SM-browser-${crypto.randomUUID()}`,
            isVoice
          })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'Request failed');
        if (result.reply) {
          addMessage('bot', result.reply);
        }
      } catch (error) {
        addMessage('bot', `⚠️ Error: ${error.message}`);
      }
    }

    document.getElementById('chat-form').addEventListener('submit', async event => {
      event.preventDefault();
      const text = messageInput.value.trim();
      if (!text) return;
      messageInput.value = '';
      await sendTextMessage(text, false);
    });

    // Document Upload feature
    attachBtn.addEventListener('click', () => {
      fileInput.click();
    });

    fileInput.addEventListener('change', async () => {
      const file = fileInput.files[0];
      if (!file) return;

      const phone = phoneInput.value.trim();
      if (!phone) {
        alert('Please enter a sender phone number first');
        return;
      }

      addMessage('user', `[Uploaded document: ${file.name}]`, { fileName: file.name });
      const formData = new FormData();
      formData.append('phone', phone);
      formData.append('file', file);

      try {
        const response = await fetch('/api/test/whatsapp/upload', {
          method: 'POST',
          body: formData
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'Upload failed');
        if (result.reply) {
          addMessage('bot', result.reply);
        }
      } catch (error) {
        addMessage('bot', `⚠️ Document upload failed: ${error.message}`);
      } finally {
        fileInput.value = '';
      }
    });

    // Voice-to-Text feature (Web Speech API + Mockable preset fallback)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isRecording = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-IN';

      recognition.onstart = () => {
        isRecording = true;
        micBtn.classList.add('recording');
        sttStatus.textContent = 'Voice: Listening...';
      };

      recognition.onresult = event => {
        const transcript = event.results[0][0].transcript;
        messageInput.value = transcript;
        sttStatus.textContent = `Voice: "${transcript}"`;
        // Send directly as transcribed voice message
        sendTextMessage(transcript, true);
        messageInput.value = '';
      };

      recognition.onerror = event => {
        sttStatus.textContent = `Voice error: ${event.error}`;
        micBtn.classList.remove('recording');
        isRecording = false;
      };

      recognition.onend = () => {
        isRecording = false;
        micBtn.classList.remove('recording');
        sttStatus.textContent = 'Voice: Ready';
      };
    }

    micBtn.addEventListener('click', () => {
      if (recognition) {
        if (isRecording) {
          recognition.stop();
        } else {
          recognition.start();
        }
      } else {
        // Fallback if browser SpeechRecognition is not permitted or unavailable
        const sample = prompt('Web Speech API is not supported in this browser. Enter simulated speech text:');
        if (sample) {
          sendTextMessage(sample, true);
        }
      }
    });

    sendPresetBtn.addEventListener('click', () => {
      const preset = voicePresetsSelect.value;
      if (preset) {
        sendTextMessage(preset, true);
      }
    });

    resetBtn.addEventListener('click', async () => {
      const phone = phoneInput.value.trim();
      try {
        const response = await fetch('/api/test/whatsapp/reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone })
        });
        if (!response.ok) throw new Error('Reset failed');
        messagesContainer.replaceChildren();
        addMessage('bot', 'Session cleared. Type "HI" to start anew.');
      } catch (error) {
        addMessage('bot', error.message);
      }
    });
  </script>
</body>
</html>
